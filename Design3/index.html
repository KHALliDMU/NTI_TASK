<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Css/style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>JobSearch<span>.com</span></h1>
            <h2>Create Your Account</h2>
            <p class="required">* Required information</p>
        </header>
        <section>
            <h3>Basic Information</h3>
            <form>
               <div class="info">
               <label><small>Email </small><span class="red">*</span></label>
               <input type="text">
               </div>
               <div class="info">
               <label><small>Password </small><span class="red">*</span></label>
               <input type="text">
               </div>
               <div class="info">
               <label><small>Retype Password </small><span class="red">*</span></label>
               <input type="text">
               </div>
               <div class="info">
               <label><small>First Name </small><span class="red">*</span></label>
               <input type="text">
               </div>
               <div class="info">
               <label><small>Last Name </small><span class="red">*</span></label>
               <input type="text">
               </div>
               <div class="info">
               <label><small>Phone Number </small><span class="red">*</span></label>
               <input type="text" placeholder="999-999-9999">
               </div>
               <div class="info">
               <label><small>Address </small><span class="red">*</span></label>
               <input type="text">
               </div>
               <div class="info">
               <label><small>City </small><span class="red">*</span></label>
               <input type="text">
               </div><div class="info">
               <label><small>Province </small><span class="red">*</span></label>
               <select>
                <option value="">Alberta</option>
                <option>Ontario</option>
                <option>Quebec</option>
                <option>British Columbia</option>
                <option>Manitoba</option>
                <option>Saskatchewan</option>
                <option>Nova Scotia</option>
                <option>New Brunswick</option>
                <option>Newfoundland and Labrador</option>
                <option>Prince Edward Island</option>
               </select>
               </div>
               <div class="info">
               <label><small>Country </small><span class="red">*</span></label>
               <input type="text">
               </div>
            </form>
        </section>
        

    </div>
</body>
</html>
