<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Css/style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
            <form class="space" >
                <input type="text" class="space">
                <div class="buttons">
                    <button   class="style sign">+</button>
                    <button   class="style sign">-</button>
                    <button   class="style sign">×</button>
                    <button   class="style sign">÷</button>
                </div>
                <div class="buttons">
                    <button   class="num style">7</button>
                    <button   class="num style">8</button>
                    <button   class="num style">9</button>
                    <button   class="num style">4</button>
                </div>
                <div class="buttons">
                    <button   class="num style">5</button>
                    <button   class="num style">6</button>
                    <button   class="num style">1</button>
                    <button   class="num style">2</button>
                </div>
                <div class="buttons">
                    <button  class="num style">3</button>
                    <button  class="num style">0</button>
                    <button  class="num style">.</button>
                    <button  class="num style last">c</button>
                </div>
                <div class="buttons">
                    <button class="sign style equal">=</button>
                </div>    
                
            </form>
    </div>
</body>
</html>
